<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
  <title id="title">Annotation pipeline</title>
  <desc id="desc">Perception extracts scene components, Decision records four-axis decisions and a constraint basis, an image-free Auditor checks consistency, and Narrator produces a component-linked explanation.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#555" stroke-width="1.2"/></marker></defs>
  <rect width="1120" height="300" fill="white"/>
  <g font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#333">
    <g fill="none" stroke="#777" stroke-width="1.25"><rect x="25" y="70" width="238" height="125" rx="3"/><rect x="302" y="70" width="238" height="125" rx="3"/><rect x="579" y="70" width="238" height="125" rx="3"/><rect x="856" y="70" width="238" height="125" rx="3"/></g>
    <g font-size="23" font-weight="600"><text x="144" y="107">Perception</text><text x="421" y="107">Decision</text><text x="698" y="107">Auditor</text><text x="975" y="107">Narrator</text></g>
    <g font-size="16"><text x="144" y="140">Critical components</text><text x="144" y="164">and scene context</text><text x="421" y="140">Four-axis decision</text><text x="421" y="164">and explicit basis</text><text x="698" y="140">Consistency checks</text><text x="698" y="164">on structured records</text><text x="975" y="140">Component-linked</text><text x="975" y="164">CoC explanation</text></g>
    <g font-size="14" fill="#666"><text x="144" y="44">Past and keyframe images</text><text x="421" y="27">Components, route, TLD,</text><text x="421" y="47">and motion evidence</text><text x="698" y="44">No image input</text><text x="975" y="27">Accepted basis and</text><text x="975" y="47">past/keyframe images</text></g>
    <g stroke="#555" stroke-width="1.3" marker-end="url(#arrow)"><path d="M264 132H291"/><path d="M541 132H568"/><path d="M818 132H845"/></g>
    <path d="M698 196V227H421V201" fill="none" stroke="#999" stroke-width="1.15" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <text x="560" y="251" font-size="14" fill="#666">Failed checks support targeted revision before narration.</text>
    <text x="560" y="279" font-size="14" fill="#666">Future context corroborates action annotation; predictor inputs remain at t ≤ 0.</text>
  </g>
</svg>
